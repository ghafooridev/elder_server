worker_processes  auto;
error_log  /opt/homebrew/var/log/nginx/error.log warn;
pid        /opt/homebrew/var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  client_max_body_size 100M;

  server {
    listen 5100;
    server_name localhost;

    # TALK
    location /talk/ {
      proxy_pass http://127.0.0.1:5103/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # AUTH
    location /auth/ {
      proxy_pass http://127.0.0.1:5107/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REMINDER
    location /reminder/ {
      proxy_pass http://127.0.0.1:5101/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # CARE
    location /care/ {
      proxy_pass http://127.0.0.1:5102/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # PRODUCT
    location /product/ {
      proxy_pass http://127.0.0.1:5104/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # FILE
    location /file/ {
      proxy_pass http://127.0.0.1:5105/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ASSISTANT
    location /assistant/ {
      proxy_pass http://127.0.0.1:5106/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # GAME
    location /game/ {
      proxy_pass http://127.0.0.1:5108/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health
    location = / {
      return 200 'API Gateway is up (dev)';
      add_header Content-Type text/plain;
    }
  }
}
