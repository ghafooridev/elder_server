worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  client_max_body_size 100M;

  server {
    listen 80;
    server_name _;

    # -----------------------
    # SOCKET.IO / WebSocket handshake for the talk service
    location /talk/socket.io/ {
      proxy_pass http://ec_talk:5103/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_buffering off;
    }

    # -----------------------
    # TALK HTTP endpoints
    location = /talk {
      return 301 /talk/;
    }
    location /talk/ {
      proxy_pass http://ec_talk:5103/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin $http_origin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_buffering off;
      proxy_cookie_path /api/ /;
      proxy_redirect off;
    }

    # AUTH
    location = /auth {
      return 301 /auth/;
    }
    location /auth/ {
      proxy_pass http://ec_auth:5107/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin $http_origin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_cookie_path /api/ /;
      proxy_redirect off;
    }

    # REMINDER
    location = /reminder {
      return 301 /reminder/;
    }
    location /reminder/ {
      proxy_pass http://ec_reminder:5101/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin $http_origin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_cookie_path /api/ /;
      proxy_buffering off;
      proxy_redirect off;
    }

    # CARE
    location = /care {
      return 301 /care/;
    }
    location /care/ {
      proxy_pass http://ec_care:5102/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin $http_origin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_cookie_path /api/ /;
      proxy_buffering off;
      proxy_redirect off;
    }

    # PRODUCT
    location = /product {
      return 301 /product/;
    }
    location /product/ {
      proxy_pass http://ec_product:5104/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin $http_origin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_cookie_path /api/ /;
      proxy_buffering off;
      proxy_redirect off;
    }

    # FILE
    location = /file {
      return 301 /file/;
    }
    location /file/ {
      proxy_pass http://ec_file:5105/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin $http_origin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_cookie_path /api/ /;
      proxy_buffering off;
      proxy_redirect off;
    }

    # ASSISTANT
    location = /assistant {
      return 301 /assistant/;
    }
    location /assistant/ {
      proxy_pass http://ec_assistant:5106/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin $http_origin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_cookie_path /api/ /;
      proxy_buffering off;
      proxy_redirect off;
    }

    # health-check root (optional)
    location = / {
      return 200 'API Gateway is up';
      add_header Content-Type text/plain;
    }
  }
}
