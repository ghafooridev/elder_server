version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net

  adminer:
    image: adminer
    container_name: ${ADMINER_CONTAINER_NAME}
    restart: always
    ports:
      - '${ADMINER_PORT}:8080'
    networks:
      - backend-net

volumes:
  pgdata:

networks:
  backend-net:
    driver: bridge
