version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - backend-net

  adminer:
    image: adminer
    container_name: ${ADMINER_CONTAINER_NAME}
    restart: always
    ports:
      - '${ADMINER_PORT}:8080'
    networks:
      - backend-net

  ec_auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    container_name: ec_auth
    restart: unless-stopped
    environment:
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL}
      PORT: ${AUTH_PORT}
      AUTH_PORT: ${AUTH_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      AUTH_ALLOWED_ORIGIN: ${AUTH_ALLOWED_ORIGIN}
    ports:
      - '${AUTH_PORT}:${AUTH_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_reminder:
    build:
      context: .
      dockerfile: apps/reminder/Dockerfile
    container_name: ec_reminder
    restart: unless-stopped
    environment:
      REMINDER_DATABASE_URL: ${REMINDER_DATABASE_URL}
      PORT: ${REMINDER_PORT}
      REMINDER_PORT: ${REMINDER_PORT}
    ports:
      - '${REMINDER_PORT}:${REMINDER_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_care:
    build:
      context: .
      dockerfile: apps/care/Dockerfile
    container_name: ec_care
    restart: unless-stopped
    environment:
      CARE_DATABASE_URL: ${CARE_DATABASE_URL}
      PORT: ${CARE_PORT}
      CARE_PORT: ${CARE_PORT}
    ports:
      - '${CARE_PORT}:${CARE_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

volumes:
  pgdata:

networks:
  backend-net:
    driver: bridge
