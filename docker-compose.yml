services:
  nats:
    image: nats:latest
    command: ['-js'] # enable JetStream
    ports:
      - '4222:4222' # client
      - '8222:8222' # monitoring
  postgres:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - backend-net

  adminer:
    image: adminer
    container_name: ${ADMINER_CONTAINER_NAME}
    restart: always
    ports:
      - '${ADMINER_PORT}:8080'
    networks:
      - backend-net

  api_gateway:
    image: nginx:stable-alpine
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - '5100:80' # Single entrypoint -> localhost:5100
    volumes:
      - ./deploy/nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ec_auth
      - ec_reminder
      - ec_care
      - ec_product
      - ec_file
      - ec_talk
      - ec_assistant
    networks:
      - backend-net

  ec_auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    container_name: ec_auth
    restart: unless-stopped
    environment:
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL}
      PRISMA_AUTH_DATABASE_URL: ${PRISMA_AUTH_DATABASE_URL}
      PORT: ${AUTH_PORT}
      AUTH_PORT: ${AUTH_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    expose:
      - '${AUTH_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_reminder:
    build:
      context: .
      dockerfile: apps/reminder/Dockerfile
    container_name: ec_reminder
    restart: unless-stopped
    environment:
      REMINDER_DATABASE_URL: ${REMINDER_DATABASE_URL}
      PRISMA_REMINDER_DATABASE_URL: ${PRISMA_REMINDER_DATABASE_URL}
      PORT: ${REMINDER_PORT}
      REMINDER_PORT: ${REMINDER_PORT}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    expose:
      - '${REMINDER_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_care:
    build:
      context: .
      dockerfile: apps/care/Dockerfile
    container_name: ec_care
    restart: unless-stopped
    environment:
      CARE_DATABASE_URL: ${CARE_DATABASE_URL}
      PRISMA_CARE_DATABASE_URL: ${PRISMA_CARE_DATABASE_URL}
      PORT: ${CARE_PORT}
      CARE_PORT: ${CARE_PORT}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    expose:
      - '${CARE_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_product:
    build:
      context: .
      dockerfile: apps/product/Dockerfile
    container_name: ec_product
    restart: unless-stopped
    environment:
      PRODUCT_DATABASE_URL: ${PRODUCT_DATABASE_URL}
      PRISMA_PRODUCT_DATABASE_URL: ${PRISMA_PRODUCT_DATABASE_URL}
      PORT: ${PRODUCT_PORT}
      PRODUCT_PORT: ${PRODUCT_PORT}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    expose:
      - '${PRODUCT_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_file:
    build:
      context: .
      dockerfile: apps/file/Dockerfile
    container_name: ec_file
    restart: unless-stopped
    environment:
      FILE_SERVER_URL: ${FILE_SERVER_URL}
      FILE_SERVER_KEY: ${FILE_SERVER_KEY}
      FILE_SERVER_SERVICE_ROLE_KEY: ${FILE_SERVER_SERVICE_ROLE_KEY}
      FILE_SERVER_BUCKET: ${FILE_SERVER_BUCKET}
      FILE_SERVER_ENDPOINT: ${FILE_SERVER_ENDPOINT}
      FILE_SERVER_ACCESS_KEY_ID: ${FILE_SERVER_ACCESS_KEY_ID}
      FILE_SERVER_SECRET_ACCESS_KEY: ${FILE_SERVER_SECRET_ACCESS_KEY}
      PORT: ${FILE_PORT}
      FILE_PORT: ${FILE_PORT}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    expose:
      - '${FILE_PORT}'
    networks:
      - backend-net

  ec_talk:
    build:
      context: .
      dockerfile: apps/talk/Dockerfile
    container_name: ec_talk
    restart: unless-stopped
    environment:
      TALK_DATABASE_URL: ${TALK_DATABASE_URL}
      PRISMA_TALK_DATABASE_URL: ${PRISMA_TALK_DATABASE_URL}
      PORT: ${TALK_PORT}
      TALK_PORT: ${TALK_PORT}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    expose:
      - '${TALK_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_assistant:
    build:
      context: .
      dockerfile: apps/assistant/Dockerfile
      args:
        SERVICE_NAME: assistant
    container_name: ec_assistant
    restart: unless-stopped
    environment:
      ASSISTANT_DATABASE_URL: ${ASSISTANT_DATABASE_URL}
      PRISMA_ASSISTANT_DATABASE_URL: ${PRISMA_ASSISTANT_DATABASE_URL}
      PORT: ${ASSISTANT_PORT}
      ASSISTANT_PORT: ${ASSISTANT_PORT}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    expose:
      - '${ASSISTANT_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_embedding:
    build:
      context: .
      dockerfile: apps/embedding/Dockerfile
    container_name: ec_embedding
    restart: unless-stopped
    environment:
      PORT: ${EMBEDDING_PORT:-8001}
    expose:
      - '${EMBEDDING_PORT:-8001}'
    depends_on:
      - ec_ollama
    networks:
      - backend-net

  ec_ollama:
    image: ollama/ollama:latest
    container_name: ec_ollama
    restart: unless-stopped
    environment:
      PORT: ${OLLAMA_PORT:-11434}
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend-net
    entrypoint: >
      sh -c "ollama serve & sleep 5 && ollama pull gemma:4b && tail -f /dev/null"

volumes:
  pgdata:
  ollama_data:

networks:
  backend-net:
    driver: bridge
