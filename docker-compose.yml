version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - backend-net

  adminer:
    image: adminer
    container_name: ${ADMINER_CONTAINER_NAME}
    restart: always
    ports:
      - '${ADMINER_PORT}:8080'
    networks:
      - backend-net

  ec_auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    container_name: ec_auth
    restart: unless-stopped
    environment:
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL}
      PORT: ${AUTH_PORT}
      AUTH_PORT: ${AUTH_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    ports:
      - '${AUTH_PORT}:${AUTH_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_reminder:
    build:
      context: .
      dockerfile: apps/reminder/Dockerfile
    container_name: ec_reminder
    restart: unless-stopped
    environment:
      REMINDER_DATABASE_URL: ${REMINDER_DATABASE_URL}
      PORT: ${REMINDER_PORT}
      REMINDER_PORT: ${REMINDER_PORT}
    ports:
      - '${REMINDER_PORT}:${REMINDER_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_care:
    build:
      context: .
      dockerfile: apps/care/Dockerfile
    container_name: ec_care
    restart: unless-stopped
    environment:
      CARE_DATABASE_URL: ${CARE_DATABASE_URL}
      PORT: ${CARE_PORT}
      CARE_PORT: ${CARE_PORT}
    ports:
      - '${CARE_PORT}:${CARE_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_product:
    build:
      context: .
      dockerfile: apps/product/Dockerfile
    container_name: ec_product
    restart: unless-stopped
    environment:
      PRODUCT_DATABASE_URL: ${PRODUCT_DATABASE_URL}
      PORT: ${PRODUCT_PORT}
      PRODUCT_PORT: ${PRODUCT_PORT}
    ports:
      - '${PRODUCT_PORT}:${PRODUCT_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_file:
    build:
      context: .
      dockerfile: apps/file/Dockerfile
    container_name: ec_file
    restart: unless-stopped
    environment:
      FILE_SERVER_URL: ${FILE_SERVER_URL}
      FILE_SERVER_KEY: ${FILE_SERVER_KEY}
      FILE_SERVER_SERVICE_ROLE_KEY: ${FILE_SERVER_SERVICE_ROLE_KEY}
      FILE_SERVER_BUCKET: ${FILE_SERVER_BUCKET}
      FILE_SERVER_ENDPOINT: ${FILE_SERVER_ENDPOINT}
      FILE_SERVER_ACCESS_KEY_ID: ${FILE_SERVER_ACCESS_KEY_ID}
      FILE_SERVER_SECRET_ACCESS_KEY: ${FILE_SERVER_SECRET_ACCESS_KEY}
      PORT: ${FILE_PORT}
      FILE_PORT: ${FILE_PORT}
    ports:
      - '${FILE_PORT}:${FILE_PORT}'
    networks:
      - backend-net

  ec_talk:
    build:
      context: .
      dockerfile: apps/talk/Dockerfile
    container_name: ec_talk
    restart: unless-stopped
    environment:
      TALK_DATABASE_URL: ${TALK_DATABASE_URL}
      PORT: ${TALK_PORT}
      TALK_PORT: ${TALK_PORT}
    ports:
      - '${TALK_PORT}:${TALK_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

  ec_assistant:
    build:
      context: .
      dockerfile: apps/assistant/Dockerfile
    container_name: ec_assistant
    restart: unless-stopped
    environment:
      ASSISTANT_DATABASE_URL: ${ASSISTANT_DATABASE_URL}
      PORT: ${ASSISTANT_PORT}
      ASSISTANT_PORT: ${ASSISTANT_PORT}
    ports:
      - '${ASSISTANT_PORT}:${ASSISTANT_PORT}'
    depends_on:
      - postgres
    networks:
      - backend-net

volumes:
  pgdata:

networks:
  backend-net:
    driver: bridge
