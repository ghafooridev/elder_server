name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup proto
        run: arduino/setup-proto@v3.0.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx nx run auth:prisma:generate

      - name: Lint
        run: npx nx run-many -t lint --parallel=3 || true

      - name: Build auth
        run: npx nx build auth

      - name: Run unit tests
        run: npx nx run-many -t test --parallel=3

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-dist
          path: dist/apps/auth
          if-no-files-found: warn
