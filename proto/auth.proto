syntax="proto3";
package auth;

service AuthService {
  rpc Authenticate (AuthenticateRequest) returns (AuthUser);
}

service UserService {
  rpc ValidateUser (ValidateUserRequest) returns (ValidateUserResponse);
}

message AuthenticateRequest {
  string token = 1;
}

message ValidateUserRequest {
  string userId = 1;
  string role = 2; // e.g., ELDER, CAREGIVER
}

message ValidateUserResponse {
  bool isValid = 1;
  User user = 2;
}

// Lightweight user shape for authentication only
message AuthUser {
  string id = 1;
  string email = 2;
  string role = 3;
}

// Full user shape for profile/validation flows
message User {
  string id = 1;
  string email = 2;
  string role = 3;
  string firstName = 4;
  string lastName = 5;
  string mobileNumber = 6;
  string avatar = 7;
}