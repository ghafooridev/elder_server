syntax = "proto3";

package reminder;

service ReminderService {
  rpc CreateReminder(CreateReminderRequest) returns (ReminderResponse);
}

message CreateReminderRequest {
  string userId = 1;
  string title = 2;
  string description = 3;
  string scheduledAt = 4; // ISO 8601 string
}

message ReminderResponse {
  string id = 1;
  string message = 2;
}
